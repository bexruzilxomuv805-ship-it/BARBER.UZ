name: Keep Render services awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS -o /dev/null -w "backend: %{http_code}\n" https://barber-uz.onrender.com/services
      - name: Ping bot
        run: |
          curl -sS -o /dev/null -w "bot: %{http_code}\n" https://barber-uz-bot.onrender.com
